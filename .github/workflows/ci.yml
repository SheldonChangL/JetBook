name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Drizzle migration consistency
        run: npm run db:check
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Test
        run: npm run test --if-present

      - name: Integration test（真 PG，testcontainers）
        run: npm run test:integration

      - name: Build
        run: npm run build
        env:
          # ── 僅供 next build 靜態收集用的 build-time placeholder env（與 Dockerfile build stage 相同）──
          # next build 收集 page data 時會 evaluate route 模組，觸發 module-scope 的
          # `import { env } from "@/lib/env"`（Zod fail-fast）；CI 無 .env，故注入
          # env.ts 僅有的兩個必填欄位佔位值，讓靜態收集通過即可。值不進任何 runtime。
          DATABASE_URL: postgresql://build:build@build-placeholder:5432/build
          BASE_URL: http://build-placeholder

  e2e:
    name: E2E smoke（Playwright，MVP 出貨閘門 N-02）
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://jetbook:local-dev-password@127.0.0.1:5432/jetbook
      BASE_URL: http://127.0.0.1:3121
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start PostgreSQL（pgroonga + pgvector，與正式同一 db image）
        run: |
          docker build -t jetbook-db:e2e ./db
          docker run -d --name jetbook-e2e-db \
            -e POSTGRES_USER=jetbook \
            -e POSTGRES_PASSWORD=local-dev-password \
            -e POSTGRES_DB=jetbook \
            -p 5432:5432 jetbook-db:e2e
          for i in $(seq 1 60); do
            if docker exec jetbook-e2e-db pg_isready -U jetbook -d jetbook >/dev/null 2>&1; then
              echo "postgres accepting connections"; break
            fi
            echo "waiting for postgres ($i)"; sleep 2
          done

      - name: Prepare .env
        run: |
          {
            echo "BASE_URL=${BASE_URL}"
            echo "DATABASE_URL=${DATABASE_URL}"
          } > .env

      - name: Apply migrations（初始化競態下重試，等 init 建好 extension）
        run: |
          for i in $(seq 1 30); do
            if npm run db:migrate; then echo "migrated"; exit 0; fi
            echo "migrate retry $i"; sleep 3
          done
          exit 1

      - name: Install Playwright browser（chromium）
        run: npx playwright install --with-deps chromium

      - name: E2E smoke（登入→建空間→建頁→編輯→閱讀→搜尋→私有隔離→登出）
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Build and push Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # hashFiles 只能用於 step 層級（job 層級 if 不支援，且 checkout 前 workspace 為空）。
      # A-02 merge Dockerfile 進 main 後，以下步驟自動生效。
      - name: Set up Docker Buildx
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: hashFiles('Dockerfile') != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sheldonchangl/jetbook:${{ github.sha }}
            ghcr.io/sheldonchangl/jetbook:latest
