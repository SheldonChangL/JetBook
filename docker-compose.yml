name: jetbook

services:
  proxy:
    image: caddy:2
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy

  web:
    build: .
    restart: always
    env_file:
      - path: .env
        required: true
    environment:
      PORT: "3000"
      # 容器內以服務名連 db（.env 的 DATABASE_URL 供本機 CLI/遷移工具用 localhost）
      DATABASE_URL: postgresql://${POSTGRES_USER:-jetbook}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jetbook}
      # 附件儲存根：對齊下方 uploads volume 掛載點（絕對路徑）；覆寫 .env 的本機開發預設 ./data/uploads
      UPLOAD_DIR: /data/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${UPLOADS_SOURCE:-uploads}:/data/uploads

  worker:
    build: .
    restart: always
    command: ["node", "dist/worker.js"]
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jetbook}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jetbook}
      # 附件儲存根：與 web 一致，對齊 uploads volume 掛載點（zip 匯入等 worker 路徑亦寫此）
      UPLOAD_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${UPLOADS_SOURCE:-uploads}:/data/uploads

  # Office 附件轉 PDF 預覽（M4-12，issue #216）：內建 LibreOffice 的 stateless 轉檔服務。
  # 啟用：.env 設 PREVIEW_CONVERTER_URL=http://gotenberg:3000；未設定時本服務閒置、
  # Office 附件優雅降級為僅下載（PDF 預覽不受影響）。僅內網，不對外開 port。
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always

  db:
    build: db/
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jetbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必須在 .env 設定}
      POSTGRES_DB: ${POSTGRES_DB:-jetbook}
    ports:
      # 僅綁 loopback：供本機開發跑 migration／整合測試，不對外
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jetbook} -d ${POSTGRES_DB:-jetbook}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # N-03 備份 sidecar：每小時 pg_dump -Fc（保留 48 份）＋每日晉升（保留 30 天）＋uploads rsync 鏡像。
  # 以高頻邏輯備份達成 RPO ≤ 1h（小庫合理）；WAL 歸檔取捨與升級路徑見 docs/ops/backup-restore-runbook.md。
  backup:
    build: backup/
    restart: always
    env_file:
      - path: .env
        required: true
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-jetbook}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必須在 .env 設定}
      PGDATABASE: ${POSTGRES_DB:-jetbook}
      # 保留策略（可經 .env 覆寫）：小時備份份數、日備保留天數、cron 排程
      HOURLY_KEEP: ${BACKUP_HOURLY_KEEP:-48}
      DAILY_KEEP_DAYS: ${BACKUP_DAILY_KEEP_DAYS:-30}
      CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 * * * *}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backups:/backups
      # 附件來源唯讀掛載：備份不可寫壞正式資料
      - ${UPLOADS_SOURCE:-uploads}:/data/uploads:ro

volumes:
  pgdata:
  # 附件儲存來源：預設用此 named volume（位於 /var/lib/docker/volumes/jetbook_uploads/_data）。
  # 要改存到自指定的主機目錄：於 .env 設 UPLOADS_SOURCE=/你的/絕對路徑（會變 bind mount）；
  # 注意 bind mount 不繼承 image 的 owner，須先 `sudo mkdir -p <路徑> && sudo chown -R 1001:1001 <路徑>`。
  uploads:
  # 備份存放區。正式環境應改綁至「不同實體主機」的儲存（NFR-DATA-03）——
  # 見 runbook「異機保存」段落；此處 named volume 為單機基準。
  backups:
